name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: "月下祓行 ${{ github.ref_name }}"
          body: |
            ## 月下祓行 — 日式和風黑暗奇幻 RPG

            ### 零依赖 · 双击即玩
            无需安装 Node.js / Deno / 任何运行时。
            服务端内嵌在应用中，打开即自动启动。

            ### 平台
            | 平台 | 格式 |
            |------|------|
            | Windows | .exe / .msi |
            | macOS | .dmg |
            | Linux | .AppImage / .deb |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            librsvg2-dev patchelf libappindicator3-dev

      - name: Extract JSON data from JS
        run: |
          node -e "
          const items = require('./items-data.js');
          const progression = require('./progression-data.js');
          const chest = require('./chest-data.js');
          const fs = require('fs');
          function stringifyKeys(obj) {
            if (Array.isArray(obj)) return obj.map(stringifyKeys);
            if (obj && typeof obj === 'object') {
              const r = {};
              for (const [k,v] of Object.entries(obj)) r[String(k)] = stringifyKeys(v);
              return r;
            }
            return obj;
          }
          const data = {
            categories: items.categories,
            equipmentSlots: items.equipmentSlots,
            resonance: items.resonance,
            items: items.items,
            itemMap: items.itemMap,
            inventoryDefault: stringifyKeys(items.inventoryDefault),
            resonanceTierOrder: items.resonanceTierOrder || [],
            resonanceTierLabels: stringifyKeys(items.resonanceTierLabels || {}),
            resonanceLevelToTierKey: stringifyKeys(items.resonanceLevelToTierKey || {}),
            resonanceTierKeyToLevel: stringifyKeys(items.resonanceTierKeyToLevel || {}),
          };
          fs.writeFileSync('items-data.json', JSON.stringify(data, null, 2));
          fs.writeFileSync('progression-data.json', JSON.stringify({plaqueExperience: progression.plaqueExperience, pathRequirements: progression.pathRequirements}, null, 2));
          fs.writeFileSync('chest-data.json', JSON.stringify({dailyCount: chest.dailyCount, spawnPoints: chest.spawnPoints}, null, 2));
          console.log('JSON data extracted');
          "

      - name: Copy game files to bundle
        run: |
          mkdir -p tsukishita-desktop/server-bundle/vendor
          cp game.js index.html styles.css items-data.js progression-data.js chest-data.js tsukishita-desktop/server-bundle/
          cp vendor/three.module.js tsukishita-desktop/server-bundle/vendor/ 2>/dev/null || true
          cp 神楽鈴.wav tsukishita-desktop/server-bundle/suzu.wav 2>/dev/null || true
          cp 神楽鈴.aif tsukishita-desktop/server-bundle/suzu.aif 2>/dev/null || true
          cp 神樂鈴-長.aif tsukishita-desktop/server-bundle/suzu-long.aif 2>/dev/null || true
          cp 神樂鈴-長.wav tsukishita-desktop/server-bundle/suzu-long.wav 2>/dev/null || true
          cp Battle.m4a Battle.flac tsukishita-desktop/server-bundle/ 2>/dev/null || true
        shell: bash

      - name: Install npm deps
        working-directory: ./tsukishita-desktop
        run: npm install

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./tsukishita-desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}
